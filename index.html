<style>
:root{
  /* Layout idea: an ordinary website that opens on the catalogue.
     PC: top bar with page links, both fabrics side by side, a plain footer.
     Phone: the same three pages, switched from a floating dock. Left-aligned throughout. */
  --paper:#F8F1E0;
  --card:#FFFFFF;
  --brand:#1E5B38;   /* Nufabric green */
  --text:#27291F;
  --muted:#4A5248;
  --line:#DDD1B4;
  --wa:#1B7F46;      /* WhatsApp buttons */
  --brass:#7A5C12;   /* prices and small labels */
  --tint:#E3EFE6;
  --display:"Playfair Display","Noto Serif SC","Songti SC",Georgia,serif;
  --body:"Lora","Noto Serif SC","Songti SC",Georgia,serif;
  --spring:cubic-bezier(.3,1.35,.5,1);
  --inout:cubic-bezier(.65,0,.35,1);
  color-scheme:light;
}
*{box-sizing:border-box}
html{height:100%}
body{margin:0;min-height:100%;background:var(--paper);color:var(--text);font-family:var(--body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer}
h1,h2,h3,p,dl,dd{margin:0}
:focus-visible{outline:2px solid var(--brand);outline-offset:3px}
[hidden]{display:none!important}

.bg{position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(110% 70% at 0% 0%,#F1E5C8 0%,transparent 55%),radial-gradient(90% 70% at 100% 100%,#E7E9D2 0%,transparent 60%),var(--paper)}
.grain{position:absolute;inset:0;width:100%;height:100%;opacity:.14;mix-blend-mode:multiply}

/* top bar */
.top{position:sticky;top:0;z-index:20;background:var(--brand);box-shadow:0 2px 10px rgba(30,42,34,.18)}
.top :focus-visible{outline-color:#fff}
.top-in{max-width:1160px;margin:0 auto;padding:8px 16px;display:flex;align-items:center;gap:14px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;min-height:44px;margin-right:auto;min-width:0}
@media (max-width:420px){.top-in{gap:10px;padding:8px 12px}.logo{width:56px}.brand-w b{font-size:17px}.brand-w i{font-size:9.5px;letter-spacing:.26em}.top .seg button{min-width:42px;padding:0 10px}}
.logo{display:block;width:64px;height:auto}
.lsw{transform:rotate(var(--a))}
.brand.landing .logo{visibility:hidden}
.brand-w{display:flex;flex-direction:column;line-height:1.05}
.brand-w b{font-family:var(--display);font-weight:900;font-size:19px;letter-spacing:.03em;color:#fff}
.brand-w i{font-style:normal;font-size:10.5px;font-weight:600;letter-spacing:.3em;color:rgba(255,255,255,.78)}
.links{display:none;gap:28px}
.links a{text-decoration:none;font-weight:600;font-size:15.5px;color:rgba(255,255,255,.8);padding:10px 2px;border-bottom:2px solid transparent;transition:color .2s,border-color .2s}
.links a:hover{color:#fff}
.links a.on{color:#fff;border-color:#F6F1E2}
.top .top-wa{display:none}
.top .btn-wa{background:#F6F1E2;color:var(--brand)}
.top .seg{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.24)}
.top .seg button{color:rgba(255,255,255,.82);font-size:14px;letter-spacing:.04em;font-family:var(--body);line-height:1}
.top .seg button[data-l=zh]{letter-spacing:.08em}
.top .seg button.on{color:var(--brand)}
.top .seg-thumb{background:#F6F1E2}

/* segmented control: 0.25s ease-in-out slide */
.seg{position:relative;display:inline-flex;flex:none;gap:2px;padding:4px;border-radius:13px;background:rgba(30,42,34,.07);border:1px solid var(--line)}
.seg button{position:relative;z-index:1;border:0;background:none;height:36px;min-width:46px;padding:0 13px;border-radius:10px;font-size:13px;font-weight:600;color:var(--muted);transition:color .25s var(--inout)}
.seg button.on{color:#fff}
.seg-thumb{position:absolute;top:4px;left:0;height:36px;width:34px;border-radius:10px;background:var(--brand);box-shadow:0 2px 6px rgba(30,42,34,.2);transition:transform .25s var(--inout),width .25s var(--inout)}
.seg.wide{display:flex;margin-top:16px}
.seg.wide button{flex:1;height:44px;font-size:15px}
.seg.wide .seg-thumb{height:44px}

/* pages */
main{max-width:1160px;margin:0 auto;padding:20px 16px 124px}
.view:not([hidden]) .st{animation:rise .5s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0)*70ms)}
.view.first:not([hidden]) .st{animation-delay:calc(var(--od,1.75s) + var(--i,0)*70ms)}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}
h1{font-family:var(--display);font-weight:800;color:var(--brand);font-size:clamp(28px,4vw,42px);line-height:1.1;letter-spacing:-.01em;text-wrap:balance}
.lede{color:var(--muted);max-width:58ch;margin-top:6px}
.fine{font-size:13px;color:var(--muted)}

.btn{min-height:46px;padding:0 18px;border-radius:14px;font-weight:700;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;border:1px solid transparent;transition:filter .2s}
.btn svg{flex:none}
.btn-wa{background:var(--wa);color:#fff}
.btn-wa:hover{filter:brightness(1.08)}
.p-foot{flex-direction:column;align-items:stretch}
.p-row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.p-row .btn-dl{min-height:38px;padding:0 13px;font-size:14px}
.p-acts{display:flex}
.p-acts .btn-wa{flex:1}
.btn-dl{background:#FFFDF5;color:var(--brand);border:1px solid var(--brand)}
.btn-dl:hover{background:#EEF3E7}
.btn-wa:active{filter:brightness(.94)}

/* our story: a banner with the photos as the background and the words floating over them */
.story{position:relative;isolation:isolate;display:grid;align-items:end;min-height:400px;border-radius:22px;overflow:hidden;margin-bottom:26px;background:#123D25;color:#F6F1E2;box-shadow:0 14px 34px rgba(30,42,34,.16)}
.story::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(190deg,rgba(14,48,29,.1) 0%,rgba(14,48,29,.55) 42%,rgba(12,42,26,.94) 100%)}
.shots{position:absolute;inset:0;z-index:-2}
.shot{position:absolute;inset:0;display:flex;align-items:flex-start;justify-content:flex-end;padding:14px;opacity:0;animation:shotFade 18s infinite;background:repeating-linear-gradient(135deg,#34805A 0 18px,#2E7552 18px 36px)}
.shot:first-child{opacity:1;animation-delay:-1.1s}
.shot:nth-child(2){animation-delay:4.9s;background:repeating-linear-gradient(135deg,#2F7C78 0 18px,#29706C 18px 36px)}
.shot:nth-child(3){animation-delay:10.9s;background:repeating-linear-gradient(135deg,#6C8848 0 18px,#627D40 18px 36px)}
.shots .shot:nth-child(1){background:#3a3a2e url("assets/img/story-1.jpg") center/cover no-repeat}
.shots .shot:nth-child(2){background:#3a3a2e url("assets/img/story-2.jpg") center/cover no-repeat}
.shots .shot:nth-child(3){background:#3a3a2e url("assets/img/story-3.jpg") center/cover no-repeat}
@keyframes shotFade{0%{opacity:0}6%{opacity:1}33%{opacity:1}39%{opacity:0}100%{opacity:0}}
.shot-l{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:9px;border:1.5px dashed rgba(246,241,226,.7);background:rgba(12,42,26,.35);font-size:12.5px;font-weight:600;color:#F6F1E2}
.story-t{padding:24px 18px 22px;max-width:600px}
.story-t.swap>*{animation:rise .5s cubic-bezier(.2,.8,.2,1) both}
.story-t.swap>*:nth-child(3){animation-delay:.12s}
.story-k{font-size:13.5px;font-weight:700;color:#F0B43A;margin-bottom:8px}
.story h2{font-family:var(--display);font-weight:800;font-size:clamp(27px,3.6vw,42px);line-height:1.12;letter-spacing:-.01em;color:#fff;text-wrap:balance}
.story-cta{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
.story-cta .btn{min-height:44px}
.btn-call{background:rgba(246,241,226,.12);color:#F6F1E2;border:1px solid rgba(246,241,226,.55)}
.btn-call:hover{background:rgba(246,241,226,.2)}
.story-p{margin-top:12px;font-size:16px;line-height:1.6;color:rgba(246,241,226,.94);max-width:52ch}
/* temporary bar for comparing story versions; to be removed once one is chosen */
.pv{max-width:1160px;margin:10px auto 0;padding:0 16px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.pv span{flex:1 1 100%}
.pv-g{display:flex;align-items:center;gap:8px;flex-wrap:wrap;flex:1 1 100%}
.pv-g b{font-weight:700;color:var(--brass);min-width:52px}
.pv button{height:40px;padding:0 14px;border-radius:20px;border:1.5px dashed #B9AE8F;background:#fff;font-weight:600;font-size:13.5px;color:var(--text)}
.pv button.on{border-style:solid;border-color:var(--brand);color:var(--brand)}
/* big photo cards that lead to a section */
body.lay-3 .lay2{display:none!important}
body.lay-2 .dk{width:64px}
.bigcards{display:grid;gap:14px}
.bigcard{position:relative;isolation:isolate;display:flex;flex-direction:column;justify-content:flex-end;gap:6px;min-height:190px;padding:20px;border-radius:10px;overflow:hidden;text-decoration:none;color:#F6F1E2;background:#3E5236;box-shadow:0 12px 28px rgba(60,48,20,.14);transition:transform .35s var(--spring),box-shadow .35s}
.bigcard:hover{transform:translateY(-3px);box-shadow:0 18px 36px rgba(60,48,20,.2)}
.bigcard:active{transform:scale(.985)}
.bigcard .bc-ph{position:absolute;inset:0;z-index:-2;filter:sepia(.3) saturate(.85);background:repeating-linear-gradient(135deg,#5F7B55 0 18px,#57714D 18px 36px);display:flex;justify-content:flex-end;align-items:flex-start;padding:14px}
.bigcard.c2 .bc-ph{background:repeating-linear-gradient(135deg,#7D7752 0 18px,#736D4A 18px 36px)}
.bigcard.c3 .bc-ph{background:repeating-linear-gradient(135deg,#6D775A 0 18px,#646E52 18px 36px)}
.bigcard::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(24,32,18,0) 20%,rgba(24,32,18,.6) 55%,rgba(20,28,16,.94) 100%)}
.bigcard::after{content:"";position:absolute;inset:7px;border:1px solid rgba(246,241,226,.5);border-radius:4px;pointer-events:none}
.bigcard h2{font-family:var(--display);font-weight:800;font-size:clamp(24px,2.6vw,32px);line-height:1.1;color:#fff;display:flex;align-items:center;gap:10px}
.bigcard h2 svg{flex:none;transition:transform .3s var(--spring)}
.bigcard:hover h2 svg{transform:translateX(4px)}
.bigcard p{font-size:15px;color:rgba(246,241,226,.9);max-width:40ch}
/* catalogue card on Home: fabric photos that fade from one to the next */
.bigcard .bc-slides{position:absolute;inset:0;z-index:-2;overflow:hidden;background:#1B2F52}
.bc-slide{position:absolute;inset:0;z-index:0;background-size:cover;background-position:center;opacity:0;transform:scale(1);transition:opacity .9s ease,transform 0s linear 1s}
.bc-slide.on{z-index:2;opacity:1;transform:scale(1.05);transition:opacity .9s ease,transform 4.6s linear}
.bc-slide.prev{z-index:1;opacity:1;transform:scale(1.06);transition:transform 4.6s linear}
.bc-slide.s1{background-image:url("assets/img/home-fabric-1.webp")}
.bc-slide.s2{background-image:url("assets/img/home-fabric-2.webp")}
.bc-slide.s3{background-image:url("assets/img/home-fabric-3.webp")}
.bc-slide.s4{background-image:url("assets/img/home-fabric-4.webp")}
.bc-dots{position:absolute;top:18px;right:18px;z-index:1;display:flex;gap:6px;padding:6px 8px;border-radius:99px;background:rgba(16,24,14,.34);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.bc-dots i{display:block;width:6px;height:6px;border-radius:99px;background:rgba(255,255,255,.55);transition:width .4s var(--spring),background .3s}
.bc-dots i.on{width:18px;background:#fff}
.bigcard.c1::before{background:linear-gradient(180deg,rgba(20,28,16,0) 44%,rgba(20,28,16,.5) 70%,rgba(16,24,14,.9) 100%)}
.home-cards .c1{min-height:270px}
/* How to order card on Home: the four steps, drawn */
.bigcard.c2{background:#1E5B38;min-height:232px}
.bigcard.c2::before{background:linear-gradient(180deg,rgba(14,48,29,0) 40%,rgba(12,42,26,.75) 100%)}
.bigcard .bc-ph.gfx{filter:none;padding:0;display:block;background:radial-gradient(120% 90% at 20% 0%,#2B7048 0%,#1E5B38 55%,#174A2D 100%)}
.flow{position:absolute;left:26px;right:26px;top:30px;display:flex;justify-content:space-between}
.flow::before{content:"";position:absolute;left:28px;right:28px;top:27px;border-top:2px dashed rgba(244,227,176,.75)}
.stp{position:relative;display:flex;flex-direction:column;align-items:center;gap:8px;width:56px}
.stp .ico{display:grid;place-items:center;width:56px;height:56px;border-radius:50%;background:#F4E3B0;color:#1E5B38;box-shadow:0 0 0 5px #1E5B38;transition:transform .35s var(--spring)}
.stp .ico svg{width:28px;height:28px}
.stp em{font-style:normal;font-size:12.5px;font-weight:600;color:#F4E3B0;white-space:nowrap}
.bigcard.c2:hover .stp .ico{transform:translateY(-3px)}
.bigcard.c2:hover .stp:nth-child(2) .ico{transition-delay:.06s}.bigcard.c2:hover .stp:nth-child(3) .ico{transition-delay:.12s}.bigcard.c2:hover .stp:nth-child(4) .ico{transition-delay:.18s}
@media (max-width:380px){.flow{left:18px;right:18px}.stp,.stp .ico{width:50px}.stp .ico{height:50px}.flow::before{top:24px}.stp em{font-size:11.5px}}
/* How to order card: three fabric photos (tape, rolled tape, shears) that fade like the catalogue card */
.bigcard.c2{background:#193135}
.bigcard.c2 .bc-slides{background:#193135}
.bigcard.c2 .bc-slide.s1{background-image:url("assets/img/order-1.webp");background-position:center 12%}
.bigcard.c2 .bc-slide.s2{background-image:url("assets/img/order-2.webp");background-position:right 8%}
.bigcard.c2 .bc-slide.s3{background-image:url("assets/img/order-3.webp");background-position:right 6%}
.bigcard.c2::before{background:linear-gradient(180deg,rgba(20,28,16,0) 38%,rgba(20,28,16,.46) 66%,rgba(16,24,14,.9) 100%)}
/* slide dots sit at the right end of the title row, clear of the photo and the text */
.bigcard h2 .bc-dots{position:static;margin-left:auto;flex:none}
/* Visit us card: the real shop front */
.bigcard .bc-ph.bc-photo{filter:none;padding:0;background:#3E5236 var(--gate) center 34%/cover no-repeat}
.bigcard.c3::before{background:linear-gradient(180deg,rgba(20,28,16,.05) 18%,rgba(20,28,16,.58) 56%,rgba(16,24,14,.93) 100%)}
.home-cards{margin-top:4px}
.end-cards{margin-top:34px;padding-top:24px;border-top:1px solid var(--line)}
.end-cards .p-head{align-items:center;row-gap:10px}
.p-title{flex:1 1 200px;min-width:0}
.p-opts{display:flex;align-items:center;gap:10px;flex:0 0 auto}
.p-opts .opts{margin-top:0;gap:6px;flex-wrap:nowrap}
.p-opts .opt{min-height:44px;min-width:70px;padding:4px 12px}
.p-opts .opt b{font-size:14.5px}
.p-opts .opt small{font-size:12px}
.pspec div{padding:8px 12px}
@media (min-width:760px){.p-opts{flex-direction:column;align-items:flex-end;gap:5px}.p-opts .opt{min-width:64px;padding:4px 11px}.p-title{flex-basis:170px}}
.klabel{display:block;margin-bottom:12px}
/* catalogue */
.facts{display:grid;margin-top:14px;border-top:1px solid var(--line)}
.facts div{display:flex;justify-content:space-between;align-items:baseline;gap:14px;padding:9px 0;border-bottom:1px solid var(--line)}
.facts dt{font-size:13.5px;color:var(--muted);flex:none}
.facts dd{font-weight:700;font-size:15px;text-align:right}
.prods{display:grid;gap:18px;margin-top:16px}

.tex-jc{background:linear-gradient(118deg,rgba(255,255,255,.34) 0%,rgba(255,255,255,0) 28%,rgba(0,0,0,.22) 52%,rgba(255,255,255,.2) 74%,rgba(0,0,0,.18) 100%),repeating-linear-gradient(100deg,rgba(255,255,255,.05) 0 34px,rgba(0,0,0,.07) 34px 80px),var(--c)}
.tex-pq{background:radial-gradient(circle,rgba(0,0,0,.3) 1.5px,transparent 2.1px) 0 0/9px 9px,radial-gradient(circle,rgba(0,0,0,.3) 1.5px,transparent 2.1px) 4.5px 4.5px/9px 9px,radial-gradient(circle,rgba(255,255,255,.16) 1px,transparent 1.6px) 2.2px 2.2px/9px 9px,linear-gradient(140deg,rgba(255,255,255,.16),rgba(0,0,0,.16)),var(--c)}
/* the roll: a 3D bolt of fabric unrolled across the stage; arrows step through the colours */
.stage{position:relative;height:300px;border-radius:16px;overflow:hidden;touch-action:pan-y;
  background:linear-gradient(114deg,transparent 14%,rgba(255,246,218,.95) 17% 29%,transparent 32% 36%,rgba(255,246,218,.8) 39% 50%,transparent 53%),linear-gradient(180deg,#EEE5CF,#E0D5BB)}
.stage::after{content:"";position:absolute;inset:0;z-index:1;pointer-events:none;background:linear-gradient(114deg,transparent 10%,rgba(255,224,150,.5) 26%,rgba(255,224,150,.28) 46%,transparent 62%);mix-blend-mode:soft-light}
.arr,.sw-tag,.sw-count{z-index:2}
.lightseg{position:absolute;top:auto;right:auto;bottom:12px;left:50%;z-index:2;background:rgba(255,253,245,.9);box-shadow:0 2px 8px rgba(60,48,20,.12)}
.lightseg button{height:32px;display:inline-flex;align-items:center;gap:5px;font-size:13px;padding:0 10px;color:var(--muted)}
.lightseg button.on{color:#fff}
.lightseg .seg-thumb{height:32px}
.lightseg button{gap:0;min-width:34px;padding:0 9px}
.lightseg .ll{display:inline-block;max-width:0;margin-left:0;opacity:0;overflow:hidden;white-space:nowrap;vertical-align:middle;transition:max-width .4s var(--inout),margin-left .4s var(--inout),opacity .25s}
.lightseg button.lo .ll{max-width:120px;margin-left:5px;opacity:1;transition:max-width .4s var(--inout),margin-left .4s var(--inout),opacity .3s .08s}
@media (prefers-reduced-motion:reduce){.lightseg .ll{transition:none}}
.stage-gl{position:absolute;inset:0}
.stage-gl canvas{display:block;width:100%;height:100%}
.sw-flat{position:absolute;inset:16px 64px 44px;border-radius:10px}
.stage.gl .sw-flat{display:none}
.arr{position:absolute;top:50%;width:44px;height:44px;margin-top:-22px;border-radius:50%;border:1px solid var(--line);background:rgba(255,255,255,.94);color:var(--brand);display:grid;place-items:center;padding:0;box-shadow:0 4px 12px rgba(30,42,34,.14);transition:transform .2s var(--spring)}
.arr:hover{transform:scale(1.08)}
.arr:active{transform:scale(.94)}
.arr-l{left:10px}
.arr-r{right:10px}
.sw-count{position:absolute;right:14px;bottom:16px;font-size:13px;font-weight:600;color:var(--muted);background:none;padding:0;letter-spacing:.02em}
.sw-tag{position:absolute;left:12px;top:12px;background:rgba(6,23,15,.74);color:#fff;border-radius:8px;padding:4px 9px;font-size:12.5px;font-weight:600}
.p-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.p-head h2{font-family:var(--display);font-weight:800;font-size:27px;line-height:1.1;color:var(--brand)}
.p-head p{color:var(--muted);font-size:14.5px;margin-top:3px}
.wchips{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.wc{height:28px;padding:0 10px;border-radius:8px;border:1px solid var(--line);background:#fff;display:inline-flex;align-items:center;font-weight:600;color:var(--text)}
.klabel{font-family:var(--body);font-size:13px;font-weight:700;color:var(--brass)}
/* shade card: each tone family is a ruled row; each colour is a little swatch cut with pinking shears */
.cols{margin-top:8px;padding:4px 14px;border:1px solid var(--line);border-radius:6px;background:linear-gradient(180deg,#FFFDF7,#FBF6EA);box-shadow:inset 0 0 0 4px #FFFDF7,inset 0 0 0 5px #EFE5CC}
.famrow{display:grid;grid-template-columns:84px 1fr;align-items:center;gap:10px;padding:10px 0;border-top:1px dashed #E3D7BA}
.famrow.nolabel{grid-template-columns:1fr}
.famrow:first-child{border-top:0}
.famname{font-style:italic;font-size:12.5px;line-height:1.3;color:var(--brass);letter-spacing:.01em}
.chips{display:flex;flex-wrap:wrap;gap:9px 8px;padding:2px 0}
.cdot{flex:none;width:42px;height:32px;border:0;padding:0;position:relative;display:grid;place-items:center;background:none;filter:drop-shadow(0 1px 1px rgba(60,48,20,.35)) drop-shadow(0 3px 4px rgba(60,48,20,.16));transition:transform .25s var(--spring),filter .25s}
.cdot .sw{position:absolute;inset:0;clip-path:polygon(6.0% 8.0%,10.4% 0.0%,14.8% 8.0%,19.2% 0.0%,23.6% 8.0%,28.0% 0.0%,32.4% 8.0%,36.8% 0.0%,41.2% 8.0%,45.6% 0.0%,50.0% 8.0%,54.4% 0.0%,58.8% 8.0%,63.2% 0.0%,67.6% 8.0%,72.0% 0.0%,76.4% 8.0%,80.8% 0.0%,85.2% 8.0%,89.6% 0.0%,94.0% 8.0%,100.0% 14.0%,94.0% 20.0%,100.0% 26.0%,94.0% 32.0%,100.0% 38.0%,94.0% 44.0%,100.0% 50.0%,94.0% 56.0%,100.0% 62.0%,94.0% 68.0%,100.0% 74.0%,94.0% 80.0%,100.0% 86.0%,94.0% 92.0%,89.6% 100.0%,85.2% 92.0%,80.8% 100.0%,76.4% 92.0%,72.0% 100.0%,67.6% 92.0%,63.2% 100.0%,58.8% 92.0%,54.4% 100.0%,50.0% 92.0%,45.6% 100.0%,41.2% 92.0%,36.8% 100.0%,32.4% 92.0%,28.0% 100.0%,23.6% 92.0%,19.2% 100.0%,14.8% 92.0%,10.4% 100.0%,6.0% 92.0%,0.0% 86.0%,6.0% 80.0%,0.0% 74.0%,6.0% 68.0%,0.0% 62.0%,6.0% 56.0%,0.0% 50.0%,6.0% 44.0%,0.0% 38.0%,6.0% 32.0%,0.0% 26.0%,6.0% 20.0%,0.0% 14.0%,6.0% 8.0%);background:repeating-linear-gradient(90deg,rgba(255,255,255,.07) 0 1px,transparent 1px 3px),repeating-linear-gradient(0deg,rgba(0,0,0,.05) 0 1px,transparent 1px 3px),linear-gradient(155deg,rgba(255,255,255,.26),rgba(255,255,255,0) 42%,rgba(0,0,0,.1)),var(--c)}
.prod[data-f="jc"] .cdot .sw{background-image:var(--kjc),linear-gradient(155deg,rgba(255,255,255,.24),rgba(255,255,255,0) 42%,rgba(0,0,0,.08));background-size:24px 24px,auto;background-blend-mode:soft-light,normal}
.prod[data-f="pq"] .cdot .sw{background-image:var(--kpq),linear-gradient(155deg,rgba(255,255,255,.2),rgba(255,255,255,0) 42%,rgba(0,0,0,.08));background-size:28px 25px,auto;background-blend-mode:soft-light,normal}
.sw-flat.tex-jc{background-image:var(--kjc),linear-gradient(118deg,rgba(255,255,255,.3) 0%,rgba(255,255,255,0) 28%,rgba(0,0,0,.2) 52%,rgba(255,255,255,.18) 74%,rgba(0,0,0,.16) 100%);background-size:36px 36px,auto;background-blend-mode:soft-light,normal;background-color:var(--c)}
.sw-flat.tex-pq{background-image:var(--kpq),linear-gradient(140deg,rgba(255,255,255,.14),rgba(0,0,0,.14));background-size:42px 37px,auto;background-blend-mode:soft-light,normal;background-color:var(--c)}
.cn{position:relative;z-index:1;font-size:11px;font-weight:700;color:var(--ink);opacity:0;transition:opacity .2s;font-variant-numeric:tabular-nums}
.cdot.sel .cn{opacity:1}
.cdot::before{content:"";position:absolute;inset:-3px}
@media (hover:hover){
  .cdot:hover{transform:translateY(-3px) rotate(-2deg);z-index:3;filter:drop-shadow(0 2px 2px rgba(60,48,20,.3)) drop-shadow(0 8px 8px rgba(60,48,20,.28))}
  .cdot:hover .cn{opacity:1}
  .cdot[data-tip]:hover::after{content:attr(data-tip);position:absolute;bottom:calc(100% + 9px);left:50%;transform:translateX(-50%);white-space:nowrap;background:#27291F;color:#F6F1E2;font-size:12.5px;font-weight:600;line-height:1;padding:7px 10px;border-radius:6px;box-shadow:0 6px 16px rgba(0,0,0,.22);pointer-events:none;z-index:6}
}
.cdot.out{opacity:.5}
.cdot.soon{opacity:.85}
.cdot.soon.sel{opacity:1}
detailsdetails.soon{margin-top:10px}
details.soon summary{cursor:pointer;list-style:none;display:inline-flex;align-items:center;gap:8px;min-height:40px;font-size:14px;font-weight:600;color:var(--muted)}
details.soon summary::-webkit-details-marker{display:none}
details.soon summary::before{content:"";width:8px;height:8px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(-45deg);transition:transform .25s}
details.soon[open] summary::before{transform:rotate(45deg)}
details.soon p{font-size:13.5px;color:var(--muted);margin:2px 0 6px}
details.soon p a{color:var(--brand);font-weight:700;text-underline-offset:2px}
.cdot.sel{transform:translateY(-2px);z-index:2;filter:drop-shadow(0 0 1px #1E5B38) drop-shadow(0 0 1px #1E5B38) drop-shadow(0 0 1px #1E5B38) drop-shadow(0 6px 6px rgba(60,48,20,.3))}
.cdot.out::after{content:"";position:absolute;left:50%;top:-2px;bottom:-2px;width:2px;margin-left:-1px;background:#fff;box-shadow:0 0 0 1px rgba(0,0,0,.4);transform:rotate(45deg)}
.p-stock{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:14.5px}
.cnote{list-style:none;display:grid;gap:6px;margin:10px 0 0;padding:9px 11px;border-radius:10px;background:#FFF5D9;border:1px solid #EBD9A2;font-size:13px;line-height:1.4;color:#4E3F12}
.cnote li{display:flex;align-items:flex-start;gap:8px}
.cnote svg{flex:none;margin-top:1px;color:var(--brass)}
.cnote a{color:var(--brand);font-weight:700;text-underline-offset:2px}
.sdot{flex:none;width:9px;height:9px;border-radius:50%;background:currentColor}
.s-in{color:var(--brand)}.s-ask{color:var(--muted)}.s-av{color:var(--brand)}.s-soon{color:var(--muted)}.s-low{color:#8A6A00}.s-out{color:#A8321F}
.opts{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.opt{min-height:52px;min-width:88px;padding:6px 14px;border-radius:8px;border:1px solid var(--line);background:#FFFDF5;display:grid;justify-items:start;align-content:center;gap:1px;text-align:left;transition:border-color .2s,background .2s,box-shadow .2s}
.opt b{font-weight:700;font-size:15px;line-height:1.2}
.opt small{font-size:12.5px;color:var(--muted)}
.opt:hover{border-color:#B9AE8F}
.opt.on{border-color:var(--brand);box-shadow:inset 0 0 0 1px var(--brand);background:#EEF3E7}
.opt.on b{color:var(--brand)}
.pspec{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:6px;overflow:hidden;margin:0}
.pspec div{background:#FFFDF5;padding:10px 12px}
.pspec dd{margin-top:2px;font-weight:600;font-size:15px}
.cdot .fire{position:absolute;top:-7px;right:-7px;width:17px;height:17px;border-radius:50%;background:#FFF7EA;box-shadow:0 1px 3px rgba(60,48,20,.35);display:grid;place-items:center;pointer-events:none}
.cdot .fire svg{width:12px;height:12px}
.cdot .fire.rec{width:19px;height:19px;top:-8px;right:-8px;background:var(--brand);box-shadow:0 0 0 1.5px #F2C14E,0 1px 4px rgba(60,48,20,.4)}
.cdot .fire.rec svg{width:13px;height:13px}
.col-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.legends{display:inline-flex;gap:12px;flex-wrap:wrap}
.legend,.bestseller{display:inline-flex;align-items:center;gap:4px;font-size:12.5px;font-weight:700;color:#B4470F}
.legend.rec,.bestseller.rec{color:var(--brand)}
.legend svg,.bestseller svg{width:14px;height:14px}
.bestseller{margin-left:4px;padding:2px 9px 2px 6px;border-radius:10px;background:#FFF1DE}
.bestseller.rec{background:#E9F1E4;box-shadow:inset 0 0 0 1px #D8C27A}
.tol{font-size:12px;font-weight:400;color:var(--muted);white-space:nowrap}
.gbar{display:block;height:5px;border-radius:3px;background:rgba(60,48,20,.12);margin-top:7px;overflow:hidden}
.gbar i{display:block;height:100%;border-radius:3px;background:var(--brass);transition:width .5s cubic-bezier(.2,.8,.2,1)}
.gscale{display:flex;justify-content:space-between;margin-top:3px;font-size:11px;font-weight:400;color:var(--muted)}
.specs{display:grid;gap:12px}
.specs dd{font-size:15px;margin-top:2px}
.p-foot{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:14px}
.p-price{font-family:var(--display);font-weight:700;font-size:22px;color:var(--brass);line-height:1.2}
.p-foot .btn{flex:1 1 220px}

/* how to order */
.hsteps{list-style:none;margin:18px 0;padding:0;display:grid;gap:12px}
.card{border:1px solid var(--line);border-radius:20px;background:linear-gradient(170deg,#FFFFFF,#F8F3E6);padding:18px;box-shadow:0 10px 28px rgba(30,42,34,.06)}
.hsteps li{display:grid;grid-template-columns:40px minmax(0,1fr);gap:4px 14px;align-content:start}
.hn{grid-row:1/3;width:40px;height:40px;border-radius:50%;border:2px solid var(--brass);color:var(--brass);font-weight:700;display:grid;place-items:center}
.hsteps h2{font-family:var(--display);font-weight:700;font-size:20px;line-height:1.2;color:var(--brand);align-self:center}
.hsteps p{grid-column:2;color:var(--muted);font-size:15px}

/* visit */
.visit-grid{display:grid;gap:14px;margin-top:18px}
.status h2{font-family:var(--display);font-weight:800;font-size:28px;line-height:1.1;color:var(--brand)}
.status p{color:var(--muted);margin-top:4px}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:14px}
.wd{display:grid;gap:6px;justify-items:center;font-size:12.5px;font-weight:600;color:var(--muted)}
.wd i{display:block;width:100%;height:6px;border-radius:3px;background:rgba(30,42,34,.13)}
.wd.o i{background:var(--brand)}
.wd.today span{background:var(--text);color:#fff;border-radius:8px;padding:0 6px}
.contact{display:grid;gap:12px}
.contact div{border-bottom:1px solid var(--line);padding-bottom:12px}
.contact div:last-child{border-bottom:0;padding-bottom:0}
.contact dd{font-weight:600;font-size:16px;margin-top:2px;word-break:break-word;user-select:text;-webkit-user-select:text}
.map{position:relative;display:grid;align-content:end;gap:8px;min-height:190px;border-radius:20px;border:1px solid var(--line);padding:18px;text-decoration:none;overflow:hidden;background:radial-gradient(rgba(30,91,56,.2) 1px,transparent 1.5px) 0 0/16px 16px,linear-gradient(160deg,#E3EFE6,#F3ECD9)}
.map .pin{position:absolute;right:22px;top:18px;color:#E2603F}
.map b{font-size:16px;max-width:26ch}
.map span{color:var(--brand);font-weight:700;font-size:15px;display:inline-flex;align-items:center;gap:6px;text-decoration:underline;text-underline-offset:3px}

.foot{display:none}

/* phone-only floating dock; icons grow under a sliding finger */
.dock{position:fixed;left:50%;bottom:12px;transform:translateX(-50%);z-index:40;display:flex;align-items:flex-end;gap:2px;padding:8px 10px;border-radius:28px;background:rgba(255,255,255,.93);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border:1px solid var(--line);box-shadow:0 14px 34px rgba(30,42,34,.18);touch-action:none;user-select:none;-webkit-user-select:none}
.dk{width:76px;display:flex;flex-direction:column;align-items:center;gap:3px;text-decoration:none;color:var(--muted);font-size:11.5px;font-weight:600}
.dk-i{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;transform-origin:50% 100%;transition:transform .3s var(--spring),background .25s,color .25s;will-change:transform}
.dock.mag .dk-i{transition:background .25s,color .25s}
.dk.on{color:var(--text)}
.dk.on .dk-i{background:var(--tint);color:var(--brand)}
.dk-wa{color:var(--text)}
.dk-wa .dk-i{background:var(--wa);color:#fff;border-radius:50%}

/* opening: the logo's fan opens, its colours burst across the screen, then spread outward to uncover the site while the stamp flies to the top bar (0.6s ease-in-out) */
.splash{position:fixed;inset:0;z-index:100;display:grid;place-items:center;pointer-events:none}
.splash-bg{position:absolute;inset:0;background:var(--brand)}
.splash canvas{position:absolute;inset:0;width:100%;height:100%}
.splash-logo{position:relative;z-index:2;width:min(64vw,260px);transform-origin:0 0}
.splash-logo .logo{width:100%}
.splash .lsw{animation:fanOpen .9s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(.15s + var(--n)*70ms)}
@keyframes fanOpen{from{transform:rotate(0deg)}}
@keyframes splashOut{to{opacity:0;visibility:hidden}}

/* older, quieter feel: ledger-style double frames, squarer corners, ruled headings */
.top{border-bottom:4px double rgba(246,241,226,.6)}
h1::after{content:"";display:block;width:64px;height:5px;margin-top:10px;border-top:1px solid var(--brass);border-bottom:1px solid var(--brass)}
.btn{border-radius:8px}
.seg{border-radius:9px}
.seg button,.seg-thumb{border-radius:6px}
.prod,.card{border-radius:10px;background:linear-gradient(170deg,#FFFDF5,#F4EAD3);box-shadow:inset 0 0 0 5px #FFFDF5,inset 0 0 0 6px var(--line),0 10px 26px rgba(60,48,20,.09)}
.stage{border-radius:6px}
.wc{border-radius:4px}
.cnote{border-radius:6px}
.map{border-radius:10px}
.dock{border-radius:18px}
.dk-i{border-radius:10px}
.story{border-radius:10px;min-height:350px}
.story::before{background:linear-gradient(190deg,rgba(34,40,22,.12) 0%,rgba(30,38,22,.58) 42%,rgba(24,32,18,.95) 100%)}
.story::after{content:"";position:absolute;inset:8px;border:1px solid rgba(246,241,226,.5);border-radius:4px;pointer-events:none}
.shot{filter:sepia(.12) saturate(.96)}
.shot-l{margin:6px}
.est{position:absolute;left:22px;top:22px;width:74px;height:74px;border-radius:50%;border:4px double rgba(246,241,226,.85);display:grid;place-content:center;justify-items:center;color:#F6F1E2;transform:rotate(-9deg);line-height:1}
.est span{font-size:10px;font-weight:700;letter-spacing:.22em;margin-right:-.22em}
.est b{font-family:var(--display);font-weight:800;font-size:21px;margin-top:3px}
@media (max-width:759px){.prod:not(.on){display:none}}
@media (min-width:760px){
  .top-in{padding:12px 32px;gap:22px}
  .logo{width:78px}
  .brand{margin-right:20px}
  .brand-w{display:none}
  .links{display:flex;margin-right:auto}
  .top .top-wa{display:inline-flex}
  .dock{display:none}
  main{padding:36px 32px 56px}
  .home-cards{grid-template-columns:1.35fr 1fr;grid-template-rows:230px 230px}
  .home-cards .c1{grid-row:1/3}
  .end-cards .bigcards{grid-template-columns:1fr 1fr}
  .end-cards .bigcard{min-height:230px}
  .pv{padding:0 32px;margin-top:14px}
  .pv span{flex:0 0 auto}
  .pv-g{flex:0 1 auto;margin-right:18px}
  .story{min-height:360px;align-items:center;margin-bottom:34px}
  .shots{display:block}
  .shot{position:absolute;top:0;bottom:0;inset-inline:auto;opacity:1;animation:none;width:44%}
  .shots .shot:nth-child(1){left:0}

  .shots .shot:nth-child(3){left:56%;-webkit-mask-image:linear-gradient(90deg,transparent 0,#000 34%);mask-image:linear-gradient(90deg,transparent 0,#000 34%)}

  .est{left:auto;top:auto;right:30px;bottom:28px;width:88px;height:88px}
  .est b{font-size:25px}
  .facts{grid-template-columns:repeat(3,auto);justify-content:start;border-top:0;margin-top:18px}
  .facts div{display:block;border-bottom:0;border-left:1px solid var(--line);padding:2px 0 2px 20px;margin-right:28px}
  .facts dd{text-align:left;margin-top:2px;white-space:nowrap}
  .fab-seg{display:none!important}
  .prods{grid-template-columns:1fr 1fr;gap:24px;margin-top:26px}
  .prod{padding:22px;gap:18px}
  .p-foot .btn{flex:0 1 auto}
  .hsteps{grid-template-columns:repeat(2,1fr);gap:18px;margin:26px 0}
  .hsteps li{grid-template-columns:1fr;gap:10px}
  .hn{grid-row:auto}
  .hsteps p{grid-column:1}
  .visit-grid{grid-template-columns:1fr 1fr;gap:24px;margin-top:26px;align-items:start}
  .map{min-height:260px}
  .foot{display:flex;flex-wrap:wrap;gap:6px 30px;max-width:1160px;margin:0 auto;padding:20px 32px 34px;border-top:1px solid var(--line);font-size:13.5px;color:var(--muted)}
  .foot b{color:var(--text)}
}
@media (min-width:1000px){
  .brand-w{display:flex}
  .brand-w b{font-size:22px}
  .cat-head{display:flex;justify-content:space-between;align-items:flex-end;gap:32px}
  .facts{flex:none;margin-top:0}
  .facts div{margin:0 0 0 20px}
  .stage{height:400px}
  .famrow{grid-template-columns:118px 1fr;gap:12px}
  .famname{font-size:13px}
  .famrow.nolabel{grid-template-columns:1fr}
  .pspec{grid-template-columns:repeat(4,1fr)}
  .specs{grid-template-columns:1fr 1fr;gap:16px 26px}
  .hsteps{grid-template-columns:repeat(4,1fr)}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  .splash{display:none}
}
.prod .p-foot{flex-direction:column;align-items:stretch}
.prod .p-row .btn{flex:0 0 auto}
.prod .p-acts .btn{flex:1 1 auto}

.sr-only{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.p-min{font-size:13.5px;color:var(--muted);margin-top:3px;line-height:1.4}
.cat-bar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.cat-bar .seg button{white-space:nowrap;padding:0 18px;min-height:40px}
.view-seg{display:none}
@media (min-width:760px){.view-seg{display:inline-flex}}
@media (max-width:759px){.cat-bar .fab-seg{flex:1 1 auto;display:flex}.cat-bar .fab-seg button{flex:1}}
.btn-side{display:none;min-height:42px;padding:0 14px;background:#FFFDF5;color:var(--brand);border:1px solid var(--line)}
.btn-side:hover{border-color:var(--brand)}
.xp{display:none;position:absolute;top:10px;right:10px;z-index:2;width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:rgba(255,255,255,.94);color:var(--brand);place-items:center;padding:0;cursor:pointer;box-shadow:0 3px 10px rgba(30,42,34,.12)}
.xp:hover{background:#fff;border-color:var(--brand)}
.xp .xp-c{display:none}
@media (min-width:760px){
  .xp{display:grid}
  .cat-bar{display:none}
  .cat-bar{display:flex;margin-top:22px}
  .fab-seg{display:none!important}
  body.solo .prods{grid-template-columns:1fr}
  body.solo .prod:not(.on){display:none}
  body.solo .xp .xp-o{display:none}
  body.solo .xp .xp-c{display:inline}
}
@media (min-width:1000px){
  body.solo .prod{grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);column-gap:28px;align-items:start}
  body.solo .prod>.p-media{grid-column:1;grid-row:1/span 6;position:sticky;top:84px}
  body.solo .prod>:not(.p-media){grid-column:2}
}

/* spec tiles */
.prod .pspec{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;background:none;border:0;border-radius:0;overflow:visible}

.prod .pspec .tile{display:flex;align-items:center;gap:10px;background:#FFFDF5;border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-width:0}
.ti,.fi{flex:none;display:grid;place-items:center;width:36px;height:36px;border-radius:50%;background:#E7EFE3;color:var(--brand)}
.ti svg,.fi svg{width:20px;height:20px}
.tv{display:flex;flex-direction:column;min-width:0}
.tv dd{order:1;margin:0;font-weight:700;font-size:15px;line-height:1.25;color:var(--text)}
.tv dt{order:2;font-size:12px;color:var(--muted);margin-top:2px}
.tv .tol{font-weight:500;font-size:11.5px;color:var(--muted)}
.tv .gbar{display:block;margin-top:5px;width:72px}
/* feature cards */
.prod .specs{display:grid;grid-template-columns:1fr;gap:10px}
@media (min-width:600px){.prod .specs{grid-template-columns:1fr 1fr}}
.feat{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:12px;background:linear-gradient(160deg,#FFFDF6,#F7F1E2);border:1px solid var(--line)}
.fi{background:#1E5B38;color:#F4E3B0;width:38px;height:38px}
.feat dt{font-weight:700;font-size:14px;color:var(--brand)}
.feat dd{margin:3px 0 0;font-size:13.5px;line-height:1.45;color:#4a4840}
/* colours header with the catalogue download */
.ch-l{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.col-head .btn-dl{min-height:34px;padding:0 12px;font-size:13.5px;gap:6px;margin:0}
.col-head .btn-dl svg{width:16px;height:16px}
/* single-fabric view: smaller roll, more room for colours */
@media (min-width:1000px){
  body.solo .prod{grid-template-columns:minmax(0,.82fr) minmax(0,1.18fr)}
  body.solo .p-media .stage{height:min(430px,calc(100vh - 250px));min-height:320px}
}

/* best-seller badge: white-edged flame on orange, ringed */
.cdot .fire:not(.rec){width:19px;height:19px;top:-8px;right:-8px;background:#E8590C;box-shadow:0 0 0 1.5px #fff,0 1px 4px rgba(120,50,10,.4)}
.cdot .fire:not(.rec) svg{width:14px;height:14px;overflow:visible}
.cdot .fire:not(.rec) svg path:first-child,.legend:not(.rec) svg path:first-child,.bestseller:not(.rec) svg path:first-child{stroke:#fff;stroke-width:2;paint-order:stroke;stroke-linejoin:round}
.legend:not(.rec) svg,.bestseller:not(.rec) svg{width:16px;height:16px;padding:2px;border-radius:50%;background:#E8590C;box-shadow:0 0 0 1.5px #fff;overflow:visible;margin-right:3px}
/* More colours */
.cue-wrap{position:sticky;bottom:18px;z-index:4;height:0;display:flex;justify-content:center}
.more-cue{position:relative;transform:translateY(-100%);display:flex;align-items:center;gap:8px;margin:0;padding:0 18px;min-height:42px;border-radius:21px;border:1px solid var(--brand);background:var(--brand);color:#fff;font:inherit;font-weight:700;font-size:14px;cursor:pointer;box-shadow:0 6px 18px rgba(20,60,35,.28);transition:opacity .3s,transform .3s}
.more-cue svg{animation:cueBob 1.4s ease-in-out infinite}
.more-cue.gone{opacity:0;transform:translateY(calc(-100% + 8px));pointer-events:none}
@media (max-width:759px){.cue-wrap{bottom:104px}}
@keyframes cueBob{0%,100%{transform:translateY(-2px)}50%{transform:translateY(3px)}}

.soon-sub{font-weight:500;font-size:13px;color:var(--brand);background:#E9F1E4;border-radius:10px;padding:2px 9px}
/* icon animations */
.ti svg,.fi svg{transform-origin:50% 50%}
.ti-width{--an:aW}.ti-k_weight{--an:aG}.ti-k_comp{--an:aC}.ti-k_stretch{--an:aS}
.fi-look{--an:aL}.fi-perf{--an:aP}.fi-best{--an:aB}.fi-print{--an:aR}
.fi-best svg{transform-origin:50% 15%}.fi-print svg{transform-origin:50% 100%}
.tile:hover .ti svg,.feat:hover .fi svg,.ti.play svg,.fi.play svg{animation:var(--an) .95s cubic-bezier(.3,.7,.3,1) both}
@keyframes aW{0%,100%{transform:scaleX(1)}40%{transform:scaleX(1.38)}72%{transform:scaleX(.9)}}
@keyframes aG{0%{transform:translateY(-8px)}55%{transform:translateY(1.5px)}75%{transform:translateY(-1.5px)}100%{transform:translateY(0)}}
@keyframes aC{0%,100%{transform:rotate(0)}25%{transform:rotate(-16deg)}60%{transform:rotate(11deg)}85%{transform:rotate(-3deg)}}
@keyframes aS{0%,100%{transform:scale(1)}42%{transform:scale(1.32)}74%{transform:scale(.92)}}
@keyframes aL{0%,100%{transform:scale(1) rotate(0)}45%{transform:scale(1.25) rotate(20deg)}75%{transform:scale(.95) rotate(-6deg)}}
@keyframes aP{0%{transform:translateX(-6px);opacity:.25}60%{transform:translateX(2px);opacity:1}100%{transform:translateX(0)}}
@keyframes aB{0%,100%{transform:rotate(0)}28%{transform:rotate(-11deg)}62%{transform:rotate(8deg)}86%{transform:rotate(-2deg)}}
@keyframes aR{0%,100%{transform:translateY(0) scaleY(1)}35%{transform:translateY(-3px) scaleY(1)}60%{transform:translateY(2px) scaleY(.82)}80%{transform:translateY(0) scaleY(1.04)}}
@media (prefers-reduced-motion:reduce){.tile:hover .ti svg,.feat:hover .fi svg,.ti.play svg,.fi.play svg,.more-cue svg{animation:none}}

/* tapping a fabric tab: its shade-card strips burst out to fill the screen, the view changes behind them, then they lift away */
function fabFx(btn,k,done){
  if(RM||!btn||!document.body.animate){done();return;}
  if(S.fx&&S.fx!=='burst'){return fabFx2(S.fx,btn,k,done);}
  var cols=k==='both'?['#0B6B3A','#12329A','#67243C','#FC79A5','#AA7530','#057C28']:NAVC[k];
  var tex=k==='both'?['jc','pq']:[k];
  var o=document.createElement('div');o.className='fx';o.style.gridTemplateColumns='repeat('+cols.length+',1fr)';
  o.innerHTML=cols.map(function(c,i){var tx=tex[i%tex.length];return '<i style="--c:'+c+';background-image:var(--k'+tx+'),linear-gradient(90deg,rgba(255,255,255,.12),rgba(0,0,0,.14))"></i>';}).join('')+'<b>'+(k==='both'?t('nav_both'):FAB[k].name)+'</b>';
  document.body.appendChild(o);
  var r=btn.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,R=Math.hypot(Math.max(cx,innerWidth-cx),Math.max(cy,innerHeight-cy))+20;
  var a=o.animate([{clipPath:'circle(0px at '+cx+'px '+cy+'px)'},{clipPath:'circle('+R+'px at '+cx+'px '+cy+'px)'}],{duration:620,easing:'cubic-bezier(.7,0,.25,1)',fill:'forwards'});
  $$('i',o).forEach(function(s,i){s.animate([{transform:'scaleY(1.6) skewX(-12deg)'},{transform:'none'}],{duration:620,easing:'cubic-bezier(.2,.8,.2,1)',delay:i*25,fill:'both'});});
  var lab=$('b',o);lab.animate([{opacity:0,transform:'translateY(14px)'},{opacity:1,transform:'none'}],{duration:380,delay:340,easing:'ease-out',fill:'forwards'});
  a.onfinish=function(){done();
    setTimeout(function(){
      lab.animate([{opacity:1},{opacity:0}],{duration:220,fill:'forwards'});
      var last;$$('i',o).forEach(function(s,i){last=s.animate([{transform:'none'},{transform:'translateY(-102%)'}],{duration:560,delay:120+i*55,easing:'cubic-bezier(.7,0,.2,1)',fill:'forwards'});});
      last.onfinish=function(){o.remove();};
    },260);};
}

function fxCols(k){return k==='both'?['#0B6B3A','#12329A','#67243C','#FC79A5','#AA7530','#057C28']:NAVC[k];}
function fxTex(k,i){return k==='both'?(i%2?'pq':'jc'):k;}
function fabFx2(kind,btn,k,done){
  var cols=fxCols(k),o=document.createElement('div');o.className='fx fx-'+kind;
  var name='<b>'+(k==='both'?t('nav_both'):FAB[k].name)+'</b>';
  function band(c,i,extra){return '<i style="--c:'+c+';background-image:var(--k'+fxTex(k,i)+'),linear-gradient(90deg,rgba(255,255,255,.12),rgba(0,0,0,.14))'+(extra||'')+'"></i>';}
  if(kind==='unroll'){o.innerHTML=band(cols[0],0)+'<span class="fx-roll" style="--c:'+cols[0]+'"></span>'+name;}
  else if(kind==='blinds'){o.style.gridTemplateRows='repeat(6,1fr)';o.innerHTML=[0,1,2,3,4,5].map(function(i){return band(cols[i%cols.length],i);}).join('')+name;}
  else {o.innerHTML=band(cols[0],0)+name;}
  document.body.appendChild(o);
  var lab=$('b',o),bands=$$('i',o),E='cubic-bezier(.7,0,.25,1)';
  function finish(anims){var last=anims[anims.length-1];last.onfinish=function(){o.remove();};}
  var inA=[];
  if(kind==='unroll'){
    var roll=$('.fx-roll',o);
    inA.push(bands[0].animate([{clipPath:'inset(0 100% 0 0)'},{clipPath:'inset(0 0 0 0)'}],{duration:700,easing:E,fill:'forwards'}));
    roll.animate([{left:'-60px'},{left:'100%'}],{duration:700,easing:E,fill:'forwards'});
  } else if(kind==='blinds'){
    bands.forEach(function(s,i){inA.push(s.animate([{transform:'translateX('+(i%2?'':'-')+'101%)'},{transform:'none'}],{duration:520,delay:i*55,easing:E,fill:'both'}));});
  } else { // drape: a cloth falls from the top with a soft wavy hem
    var w=[];for(var x=0;x<=100;x+=4){w.push(x+'% '+(96+Math.sin(x/100*Math.PI*3)*3).toFixed(2)+'%');}
    bands[0].style.clipPath='polygon(0 0,100% 0,'+w.reverse().join(',')+')';bands[0].style.height='108vh';
    inA.push(bands[0].animate([{transform:'translateY(-108%)'},{transform:'translateY(2%)',offset:.78},{transform:'translateY(0)'}],{duration:760,easing:'cubic-bezier(.3,.9,.3,1)',fill:'both'}));
  }
  lab.animate([{opacity:0,transform:'translateY(14px)'},{opacity:1,transform:'none'}],{duration:360,delay:360,easing:'ease-out',fill:'forwards'});
  inA[inA.length-1].onfinish=function(){done();setTimeout(function(){
    lab.animate([{opacity:1},{opacity:0}],{duration:200,fill:'forwards'});
    var out=[];
    if(kind==='unroll'){out.push(bands[0].animate([{clipPath:'inset(0 0 0 0)'},{clipPath:'inset(0 0 0 100%)'}],{duration:620,easing:E,fill:'forwards'}));}
    else if(kind==='blinds'){bands.forEach(function(s,i){out.push(s.animate([{transform:'none'},{transform:'translateX('+(i%2?'-':'')+'101%)'}],{duration:480,delay:i*55,easing:E,fill:'forwards'}));});}
    else {out.push(bands[0].animate([{transform:'translateY(0)'},{transform:'translateY(-110%)'}],{duration:620,easing:E,fill:'forwards'}));}
    finish(out);},260);};
}

/* ---------- how to order ---------- */
var HO={mode:'order',f:null,o:{jc:1,pq:0},lines:null,dest:'w',topics:{}};
var HO_TP=['price','col','sample','bulk','east'];
function hoEsc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function hoFirst(f,used){var c=FAB[f].cols.filter(function(x){return x[2]==='av'&&x[4]&&(used||[]).indexOf(x[0])<0;})[0];return c?c[0]:'x';}
function hoInit(){if(!HO.f){HO.f=S.fabric==='pq'?'pq':'jc';}if(!HO.lines){var c=S.col[HO.f];HO.lines=[{c:c||hoFirst(HO.f),m:100}];}}
function hoCol(f,id){return FAB[f].cols.filter(function(x){return x[0]===id;})[0];}
function hoColName(f,id){if(id==='x')return t('ho_unsure');var c=hoCol(f,id);return c?c[0]+(c[4]?' '+tn(c[4]):' ('+t('ho_askus')+')'):id;}
function hoOptText(f){var o=FAB[f].opts[HO.o[f]]||FAB[f].opts[0];return o.k?t('o_'+o.k)+' '+o.g+' g/m':o.w+'″ '+o.g+' g/m';}
function hoMsg(){
  if(HO.mode==='ask'){var zh=S.lang==='zh',tp=HO_TP.filter(function(k){return HO.topics[k];}).map(function(k){return t('ho_tp_'+k);});
    return tp.length?t('ho_ask_about')+(zh?'':' ')+tp.join(zh?'、':', ')+(zh?'。':'.'):t('m_gen');}
  var L=[t('ho_q'),'• '+FAB[HO.f].name+', '+hoOptText(HO.f)];
  HO.lines.forEach(function(l){L.push('• '+hoColName(HO.f,l.c)+': '+l.m+' m');});
  L.push(t('ho_deliv')+': '+t(HO.dest==='w'?'ho_west':'ho_east'));L.push(t('ho_thx'));
  return L.join('\n');
}
function hoBtn(k,v,on,b,s){return '<button type="button" class="ho-o'+(on?' on':'')+'" data-ho="'+k+'" data-v="'+v+'" aria-pressed="'+(on?'true':'false')+'"><b>'+b+'</b>'+(s?'<small>'+s+'</small>':'')+'</button>';}
function hoField(lab,inner,extra){return '<div class="ho-f"><div class="ho-lab"><span>'+lab+'</span>'+(extra||'')+'</div>'+inner+'</div>';}
function hoForm(){
  hoInit();var F=FAB[HO.f],h='';
  h+='<div class="ho-mode" role="group">'+['order','ask'].map(function(m){var on=HO.mode===m;return '<button type="button" data-ho="mode" data-v="'+m+'" class="'+(on?'on':'')+'" aria-pressed="'+on+'">'+t('ho_m_'+m)+'</button>';}).join('')+'</div>';
  if(HO.mode==='order'){
    h+=hoField(t('ho_fab'),'<div class="ho-opts">'+['jc','pq'].map(function(f){return hoBtn('fab',f,HO.f===f,FAB[f].name,t('ho_sub_'+f));}).join('')+'</div>');
    h+=hoField(t(F.sel==='thick'?'k_weight':'width'),'<div class="ho-opts ho-n'+F.opts.length+'">'+F.opts.map(function(o,i){return hoBtn('opt',i,(HO.o[HO.f]||0)===i,o.k?t('o_'+o.k):o.w+'″',(o.k?o.w+'″ · ':'')+o.g+' g/m');}).join('')+'</div>');
    var low=false,rows=HO.lines.map(function(l,i){
      if(HO.dest==='w'&&l.m<100)low=true;
      var c=hoCol(HO.f,l.c),hex=c?c[1]:'transparent';
      var opts=F.cols.slice().sort(function(a,b){return (+a[0])-(+b[0]);}).map(function(x){return '<option value="'+x[0]+'"'+(x[0]===l.c?' selected':'')+'>'+hoEsc(hoColName(HO.f,x[0]))+'</option>';}).join('')+'<option value="x"'+(l.c==='x'?' selected':'')+'>'+t('ho_unsure')+'</option>';
      return '<div class="ho-line"><span class="ho-sw'+(l.c==='x'?' none':'')+'" style="--c:'+hex+'"></span><label class="ho-sel"><span class="sr-only">'+t('colours')+'</span><select data-ho="col" data-i="'+i+'">'+opts+'</select></label>'+
        '<span class="ho-step"><button type="button" data-ho="m-" data-i="'+i+'" aria-label="−50 m">−</button><b>'+l.m+' m</b><button type="button" data-ho="m+" data-i="'+i+'" aria-label="+50 m">+</button></span>'+
        (HO.lines.length>1?'<button type="button" class="ho-x" data-ho="rm" data-i="'+i+'" aria-label="'+t('ho_rm')+'">×</button>':'')+'</div>';}).join('');
    var hint=HO.dest==='w'?'<p class="ho-hint'+(low?' low':'')+'">'+(low?'! ':'✓ ')+t(low?'ho_min_low':'ho_min_ok')+'</p>':'';
    h+=hoField(t('ho_cols'),'<div class="ho-lines">'+rows+'</div>'+hint+(HO.lines.length<10?'<button type="button" class="ho-add" data-ho="add">＋ '+t('ho_add')+'</button>':''),'<a href="#catalogue" data-v="catalogue">'+t('ho_seeall')+'</a>');
    h+=hoField(t('ho_dest'),'<div class="ho-opts">'+hoBtn('dest','w',HO.dest==='w',t('ho_west'),t('ho_west_s'))+hoBtn('dest','e',HO.dest==='e',t('ho_east'),t('ho_east_s'))+'</div>');
  }else{
    h+=hoField(t('ho_topics'),'<div class="ho-tps">'+HO_TP.map(function(k){var on=!!HO.topics[k];return '<button type="button" class="ho-tp'+(on?' on':'')+'" data-ho="tp" data-v="'+k+'" aria-pressed="'+on+'">'+t('ho_tp_'+k)+'</button>';}).join('')+'</div>');
  }
  var msg=hoMsg();
  var side='<div class="ho-side"><div class="ho-lab"><span>'+t('ho_preview')+'</span></div><div class="ho-chat"><div class="ho-bub">'+hoEsc(t('m_hi')+'\n'+msg).replace(/\n/g,'<br>')+'</div></div>'+
    '<a class="btn btn-wa ho-send" target="_blank" rel="noopener" href="'+wa(msg)+'">'+WAI+t('ho_send')+'</a><p class="ho-note">'+t('ho_send_s')+'</p></div>';
  return '<div class="ho-form">'+h+'</div>'+side;
}
function hoRefresh(k,v,i){var box=$('#hoBody');if(!box)return;box.innerHTML=hoForm();
  var q='[data-ho="'+k+'"]'+(v!=null?'[data-v="'+v+'"]':'')+(i!=null&&!isNaN(i)?'[data-i="'+i+'"]':''),el=box.querySelector(q)||box.querySelector('[data-ho="'+k+'"]');
  if(el){try{el.focus({preventScroll:true});}catch(_){}}}
document.addEventListener('click',function(e){var a=e.target.closest&&e.target.closest('[data-ho]');if(!a||a.tagName==='SELECT')return;
  var k=a.getAttribute('data-ho'),v=a.getAttribute('data-v'),i=parseInt(a.getAttribute('data-i'),10);hoInit();
  if(k==='mode')HO.mode=v;
  else if(k==='fab'){if(HO.f!==v){HO.f=v;HO.lines=[{c:S.col[v]||hoFirst(v),m:100}];}}
  else if(k==='opt')HO.o[HO.f]=+v;
  else if(k==='m-')HO.lines[i].m=Math.max(50,HO.lines[i].m-50);
  else if(k==='m+')HO.lines[i].m=Math.min(99950,HO.lines[i].m+50);
  else if(k==='rm'){HO.lines.splice(i,1);i=Math.max(0,i-1);}
  else if(k==='add'){HO.lines.push({c:hoFirst(HO.f,HO.lines.map(function(l){return l.c;})),m:100});}
  else if(k==='dest')HO.dest=v;
  else if(k==='tp')HO.topics[v]=!HO.topics[v];
  else return;
  hoRefresh(k,(k==='rm'||k==='m-'||k==='m+'||k==='add')?null:v,k==='add'?null:i);});
document.addEventListener('change',function(e){var s=e.target;if(!s.matches||!s.matches('select[data-ho="col"]'))return;var i=+s.getAttribute('data-i');HO.lines[i].c=s.value;hoRefresh('col',null,i);});

/* Selangor public holidays (closed). 2027 dates are the expected ones; check against the official gazette each year. */
var HOLS='2026-12-11,2026-12-25,2027-01-01,2027-01-22,2027-02-06,2027-02-07,2027-02-08,2027-02-24,2027-03-10,2027-03-11,2027-05-01,2027-05-17,2027-05-20,2027-06-06,2027-06-07,2027-06-08,2027-08-15,2027-08-16,2027-08-31,2027-09-16,2027-10-29,2027-12-11,2027-12-25'.split(',');
function klNow(){var d;try{d=new Date(new Date().toLocaleString('en-US',{timeZone:'Asia/Kuala_Lumpur'}));}catch(_){d=new Date();}var p=function(x){return (x<10?'0':'')+x;};return {day:d.getDay(),h:d.getHours()+d.getMinutes()/60,iso:d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())};}
function isOpen(){var n=klNow();return n.day>=1&&n.day<=5&&n.h>=10&&n.h<18&&HOLS.indexOf(n.iso)<0;}
function renderVisit(){
  var o=isOpen(),d=t('days').split(' '),today=(klNow().day+6)%7;
  var week=d.map(function(x,i){return '<div class="wd'+(i<5?' o':'')+(i===today?' today':'')+'"><span>'+x+'</span><i></i></div>'}).join('');

function markStory(){$$('#pv [data-act=story]').forEach(function(b){b.classList.toggle('on',+b.getAttribute('data-k')===S.story);});$$('#pv [data-act=layout]').forEach(function(b){b.classList.toggle('on',+b.getAttribute('data-y')===S.layout);});}

/* ---------- pages ---------- */
var VIEWS=['home','catalogue','order','visit'];
function homeView(){return S.layout===2?'home':'catalogue';}
function showView(v){
  if(VIEWS.indexOf(v)<0||(v==='home'&&S.layout!==2))v=homeView();
  S.view=v;
  $$('.view').forEach(function(s){s.hidden=s.getAttribute('data-view')!==v;});
  $$('.dk[data-v],.links a').forEach(function(d){var on=d.getAttribute('data-v')===v;d.classList.toggle('on',on);if(on){d.setAttribute('aria-current','page');}else{d.removeAttribute('aria-current');}});
  window.scrollTo(0,0);
  requestAnimationFrame(placeThumbs);
}
function go(v){showView(v);try{if(location.hash!=='#'+v){location.hash=v;}}catch(_){}}
window.addEventListener('hashchange',function(){var v=(location.hash||'').slice(1);if(VIEWS.indexOf(v)>=0&&v!==S.view)showView(v);});
function applyLang(){
  document.documentElement.lang={en:'en',bm:'ms',zh:'zh-Hans'}[S.lang];
  renderChrome();renderHome();renderCatalogue();renderOrder();renderVisit();
  requestAnimationFrame(placeThumbs);
}

/* ---------- actions ---------- */
document.addEventListener('toggle',function(e){var d=e.target;if(d&&d.matches&&d.matches('details.soon'))S.soonOpen[d.getAttribute('data-f')]=d.open;},true);
var dockDragged=false;
document.addEventListener('click',function(e){
  var nav=e.target.closest('a[data-v]');
  if(nav){e.preventDefault();if(dockDragged){return;}go(nav.getAttribute('data-v'));return;}
  var a=e.target.closest('[data-act]');if(!a)return;
  var act=a.getAttribute('data-act'),f=a.getAttribute('data-f');
  if(act==='lang'){S.lang=a.getAttribute('data-l');setSeg($('#langSeg'),a);applyLang();}
  else if(act==='morecue'){var d=a.parentNode.nextElementSibling;if(d){d.open=true;S.soonOpen[f]=true;a.classList.add('gone');d.scrollIntoView({behavior:RM?'auto':'smooth',block:'center'});}}
  else if(act==='pv'){var g=a.getAttribute('data-g'),v=a.getAttribute('data-v');if(g==='fx')S.fx=v;else{S.glass=v==='glass';document.body.classList.toggle('glass',S.glass);}$('#pvbar').innerHTML=pvHTML();
    if(g==='fx'){var cur=$('.ftab.on'),nx=$$('.ftab').filter(function(x){return x!==cur&&x.offsetParent;})[0];if(nx)nx.click();}}
  else if(act==='nav'){var k=a.getAttribute('data-k');if(a.classList.contains('on'))return;
    tabExpand(a,function(){
    if(isWide()){setSolo(k==='both'?null:k);var nv=$('.fnav');if(nv)scrollTo({top:Math.max(0,nv.getBoundingClientRect().top+scrollY-100),behavior:'auto'});}
    else if(k!=='both'){S.fabric=k;$$('.prod').forEach(function(p){p.classList.toggle('on',p.getAttribute('data-f')===k)});if(stages[k])stages[k].resize();navSync();requestAnimationFrame(function(){placeThumbs();cueUpdate();});}});}
  else if(act==='view'){var k=a.getAttribute('data-k');setSolo(k==='both'?null:k);}
  else if(act==='solo'||act==='side'){setSolo(act==='solo'&&!document.body.classList.contains('solo')?f:null);}
  else if(act==='__unused__'){var on=false;
    if(on){S.fabric=f;$$('.prod').forEach(function(p){p.classList.toggle('on',p.getAttribute('data-f')===f)});var fb=$('#fabSeg [data-f="'+f+'"]');if(fb)setSeg($('#fabSeg'),fb);}
    document.body.classList.toggle('solo',on);
    $$('.xp').forEach(function(x){var ff=x.getAttribute('data-f');x.setAttribute('aria-pressed',on?'true':'false');x.setAttribute('aria-label',on?t('collapse'):t('expand_f',{f:FAB[ff].name}));x.title=on?t('collapse'):t('expand');});
    requestAnimationFrame(function(){placeThumbs();var p=$('.prod[data-f="'+(on?f:S.fabric)+'"]');if(on&&p){var y=p.getBoundingClientRect().top+scrollY-90;if(y<scrollY)scrollTo({top:y,behavior:RM?'auto':'smooth'});}});}
  else if(act==='fabric'){S.fabric=f;setSeg($('#fabSeg'),a);$$('.prod').forEach(function(p){p.classList.toggle('on',p.getAttribute('data-f')===f)});if(stages[f])stages[f].resize();requestAnimationFrame(placeThumbs);}
  else if(act==='col'){var ci=FAB[f].cols.map(function(x){return x[0]}).indexOf(a.getAttribute('data-c'));setColour(f,a.getAttribute('data-c'),ci<colIdx(f)?-1:1);}
  else if(act==='step'){stepColour(f,+a.getAttribute('data-d'));}
  else if(act==='light'){var hs=a.closest('.stage');if(hs)hs.classList.remove('hint');S.light[f]=a.getAttribute('data-k');setSeg(a.parentNode,a);lsOpen(a.parentNode,a,2600);
    var p=$('.prod[data-f="'+f+'"]');if(p&&FAB[f].light){var c=colOf(f);$('.p-colwrap',p).innerHTML=colsHTML(f);$('.sw-flat',p).style.setProperty('--c',c.hex);if(stages[f])stages[f].setColour(c.hex,0);}}
  else if(act==='opt'){setOpt(f,+a.getAttribute('data-o'));}
  else if(act==='layout'){S.layout=+a.getAttribute('data-y');try{localStorage.setItem('nf-layout',String(S.layout));}catch(_){}applyLayout();markStory();renderHome();renderCatalogue();go(homeView());requestAnimationFrame(placeThumbs);}
  else if(act==='story'){S.story=+a.getAttribute('data-k');try{localStorage.setItem('nf-story',String(S.story));}catch(_){}markStory();var sh=$('.story h2'),spp=$('.story-p');if(sh){sh.textContent=t('sv'+S.story+'_h');spp.textContent=t('sv'+S.story+'_p');var bx=$('.story-t');bx.classList.remove('swap');void bx.offsetWidth;bx.classList.add('swap');}}
});

/* ---------- on the roll: swipe to change colour, mouse makes the view sway a little ---------- */
(function(){
  var cat=$('#v-catalogue'),sx=0,sf=null;
  cat.addEventListener('pointerdown',function(e){var s=e.target.closest('.stage');sf=s&&!e.target.closest('.arr')?s.getAttribute('data-f'):null;sx=e.clientX;});
  cat.addEventListener('pointerup',function(e){if(!sf)return;var dx=e.clientX-sx;if(Math.abs(dx)>40){stepColour(sf,dx<0?1:-1);}sf=null;});
  cat.addEventListener('pointercancel',function(){sf=null;});
  cat.addEventListener('pointermove',function(e){if(e.pointerType!=='mouse')return;var s=e.target.closest('.stage');['jc','pq'].forEach(function(f){if(!stages[f])return;if(s&&s.getAttribute('data-f')===f){var r=s.getBoundingClientRect();stages[f].sway((e.clientX-r.left)/r.width-.5,(e.clientY-r.top)/r.height-.5);}else{stages[f].sway(0,0);}});});
  cat.addEventListener('pointerleave',function(){['jc','pq'].forEach(function(f){if(stages[f])stages[f].sway(0,0);});});
})();

/* ---------- phone dock: icons grow under a sliding finger ---------- */
(function(){
  var dock=$('#dock'),items=$$('.dk',dock),down=false,sx=0,moved=0;
  function mag(x){dock.classList.add('mag');items.forEach(function(it){var r=it.getBoundingClientRect(),d=x-(r.left+r.width/2),s=1+.42*Math.exp(-(d*d)/(2*50*50));$('.dk-i',it).style.transform='scale('+s.toFixed(3)+')';});}
  function reset(){dock.classList.remove('mag');items.forEach(function(it){$('.dk-i',it).style.transform='';});}
  dock.addEventListener('pointermove',function(e){if(RM)return;if(e.pointerType==='mouse'||down){mag(e.clientX);}if(down){moved=Math.max(moved,Math.abs(e.clientX-sx));}});
  dock.addEventListener('pointerdown',function(e){down=true;sx=e.clientX;moved=0;dockDragged=false;if(e.pointerType!=='mouse'&&!RM)mag(e.clientX);});
  function up(e){if(!down)return;down=false;reset();
    if(e.pointerType!=='mouse'&&moved>=12&&e.type==='pointerup'){
      var best=null,bd=1e9;items.forEach(function(it){var r=it.getBoundingClientRect(),d=Math.abs(e.clientX-(r.left+r.width/2));if(d<bd){bd=d;best=it;}});
      if(best&&bd<44){var v=best.getAttribute('data-v');if(v){dockDragged=true;setTimeout(function(){dockDragged=false;},350);go(v);}}
    }}
  dock.addEventListener('pointerup',up);dock.addEventListener('pointercancel',up);dock.addEventListener('pointerleave',function(e){if(e.pointerType==='mouse')reset();});
})();

/* ---------- opening: the logo's colour fan bursts over the screen and spreads outward; the stamp flies to the top bar ---------- */
var openTok=0;
function playOpening(kind,replay){
  kind=1;
  var tok=++openTok,sp=$('#splash'),br=$('#brand'),cat=$('#main');
  if(RM){if(sp)sp.remove();return;}
  if(replay){
    if(sp)sp.remove();
    sp=document.createElement('div');sp.className='splash';sp.id='splash';sp.setAttribute('aria-hidden','true');sp.innerHTML='<div class="splash-bg"></div><div class="splash-logo" id="splashLogo"></div>';
    sp.lastChild.appendChild($('.logo',br).cloneNode(true));document.body.appendChild(sp);
    showView(homeView());$$('.view').forEach(function(v){v.classList.add('first');});
  }
  if(!sp)return;
  cat.style.setProperty('--od',{1:'1.75s',2:'1.1s',3:'1.3s'}[kind]);
  br.classList.add('landing');
  function done(){if(tok!==openTok)return;br.classList.remove('landing');if(sp.parentNode)sp.remove();$$('.view.first').forEach(function(v){v.classList.remove('first');});}
  var src=$('.splash-logo',sp),dst=$('.logo',br),cv=document.createElement('canvas'),g=cv.getContext&&cv.getContext('2d');
  if(!src||!dst||!src.animate||!g){setTimeout(done,1500);return;}
  setTimeout(done,3400);
  setTimeout(function(){
    if(tok!==openTok)return;
    var W=innerWidth,H=innerHeight,dpr=Math.min(2,window.devicePixelRatio||1);cv.width=W*dpr;cv.height=H*dpr;sp.insertBefore(cv,src);
    var a=src.getBoundingClientRect(),Rr=Math.sqrt(W*W+H*H),t0=performance.now(),flew=false;
    function oc(x){x=Math.min(1,Math.max(0,x));return 1-Math.pow(1-x,3);}
    function io(x){x=Math.min(1,Math.max(0,x));return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;}
    function fly(){
      var a2=src.getBoundingClientRect(),b2=dst.getBoundingClientRect(),sc=b2.width/a2.width;
      src.animate([{transform:'translate(0,0) scale(1)'},{transform:'translate('+(b2.left-a2.left)+'px,'+(b2.top-a2.top)+'px) scale('+sc+')'}],{duration:600,easing:'cubic-bezier(.65,0,.35,1)',fill:'forwards'});
    }
    var bg=$('.splash-bg',sp),FLY,END,draw;
    if(kind===1){ // the fan's six colours burst over the screen, then spread outward
      var px=a.left+a.width*132/260,py=a.top+a.height*148/170,half=30.6*Math.PI/180,Lh=Rr/Math.cos(half),cols=['#F0B43A','#D2456A','#14A3A1','#7B8BD6','#F07A55','#9DBA74'];
      FLY=720;END=1570;
      draw=function(t){
        if(t>=FLY)bg.style.display='none';
        for(var i=0;i<6;i++){var phi=(-82+i*60)*Math.PI/180,p2=oc((t-i*40)/480),p3=io((t-FLY-i*30)/650);if(p2<=0)continue;
          g.save();g.translate(px+Math.cos(phi)*Rr*1.08*p3,py+Math.sin(phi)*Rr*1.08*p3);g.rotate((-140*(1-p2)+14*p3)*Math.PI/180);g.scale(p2,p2);
          g.beginPath();g.moveTo(0,0);g.lineTo(Lh*Math.cos(phi-half),Lh*Math.sin(phi-half));g.lineTo(Lh*Math.cos(phi+half),Lh*Math.sin(phi+half));g.closePath();g.fillStyle=cols[i];g.fill();g.restore();}
      };
    }
    function frame(now){
      if(tok!==openTok)return;
      var t=now-t0;g.setTransform(dpr,0,0,dpr,0,0);g.clearRect(0,0,W,H);
      draw(t);
      if(t>=FLY&&!flew){flew=true;fly();}
      if(t<END){requestAnimationFrame(frame);}else{done();}
    }
    requestAnimationFrame(frame);
  },850);
}
